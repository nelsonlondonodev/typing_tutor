<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor de Mecanografía</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen"
    onclick="document.getElementById('entrada-usuario').focus()"
  >
    <div class="container mx-auto p-4 md:p-8 max-w-4xl text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-4 text-teal-400">
        Tutor de Mecanografía
      </h1>
      <p class="text-gray-400 mb-8">
        Haz clic aquí y empieza a escribir para comenzar la prueba.
      </p>

      <div
        id="texto-a-escribir"
        class="text-2xl md:text-3xl leading-relaxed bg-gray-800 p-6 rounded-lg shadow-lg mb-8 font-mono tracking-wider text-left"
      ></div>

      <textarea
        id="entrada-usuario"
        class="opacity-0 absolute w-0 h-0"
        autofocus
      ></textarea>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center mb-8">
        <div class="bg-gray-800 p-4 rounded-lg shadow-md">
          <p class="text-gray-400 text-sm">Tiempo</p>
          <p id="tiempo" class="text-3xl font-bold">0s</p>
        </div>
        <div class="bg-gray-800 p-4 rounded-lg shadow-md">
          <p class="text-gray-400 text-sm">PPM</p>
          <p id="ppm" class="text-3xl font-bold">0</p>
        </div>
        <div class="bg-gray-800 p-4 rounded-lg shadow-md">
          <p class="text-gray-400 text-sm">Precisión</p>
          <p id="precision" class="text-3xl font-bold">100%</p>
        </div>
        <div class="bg-gray-800 p-4 rounded-lg shadow-md">
          <p class="text-gray-400 text-sm">Errores</p>
          <p id="errores" class="text-3xl font-bold">0</p>
        </div>
      </div>

      <div
        id="ultimo-resultado-container"
        class="hidden bg-gray-800/50 p-4 rounded-lg shadow-md mb-8 text-lg"
      >
        <h3 class="text-xl font-bold text-teal-400 mb-2">
          Última Puntuación Guardada
        </h3>
        <p id="ultimo-resultado-texto" class="text-gray-300"></p>
      </div>

      <button
        id="reiniciar-btn"
        class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105 focus:outline-none"
      >
        Reiniciar Prueba
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
